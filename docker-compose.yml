version: '3.9'

services:
  orchestrator:
    build:
      context: ./orchestrator
    container_name: teacher-ai-orchestrator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - OPENCLAW_BASE_URL=${OPENCLAW_BASE_URL:-http://openclaw:3000}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: teacher-ai-openclaw
    restart: unless-stopped
    profiles: ["openclaw"]
    environment:
      - OPENCLAW_PORT=3000
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: teacher-ai-nginx
    restart: unless-stopped
    profiles: ["nginx"]
    depends_on:
      - orchestrator
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
